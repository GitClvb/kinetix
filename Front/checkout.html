<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinetixFit | Finalizar Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/checkout.css">
</head>

<body>

    <div id="header-container"></div>

    <main class="container py-5">
        <div class="row g-5">
            <div class="col-md-5 col-lg-4 order-md-last">
                <h4 class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-black fw-bold">Tu Carrito</span>
                    <span class="badge bg-dark rounded-pill" id="checkout-cart-count">0</span>
                </h4>
                <ul class="list-group mb-3 shadow-sm" id="checkout-cart-items">
                    </ul>
            </div>

            <div class="col-md-7 col-lg-8">
                <div class="card border-0 shadow-lg p-4">
                    <h2 class="mb-4 fw-bold text-orange text-center text-md-start">DETALLES DE PAGO</h2>
                    
                    <form id="checkoutForm" novalidate>
                        <h5 class="mb-3 fw-bold text-dark border-bottom pb-2">1. Dirección de Envío</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label for="firstName" class="form-label fw-semibold">Nombre(s)</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="lastName" class="form-label fw-semibold">Apellidos</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                            <div class="col-12">
                                <label for="address" class="form-label fw-semibold">Dirección</label>
                                <input type="text" class="form-control" id="address" placeholder="Calle, Número, Colonia" required>
                            </div>
                            <div class="col-md-5">
                                <label for="city" class="form-label fw-semibold">Ciudad / Municipio</label>
                                <input type="text" class="form-control" id="city" required>
                            </div>
                            <div class="col-md-4">
                                <label for="state" class="form-label fw-semibold">Estado</label>
                                <input type="text" class="form-control" id="state" required>
                            </div>
                            <div class="col-md-3">
                                <label for="zip" class="form-label fw-semibold">C.P.</label>
                                <input type="text" class="form-control" id="zip" placeholder="00000" required>
                            </div>
                        </div>

                        <h5 class="mb-3 fw-bold text-dark border-bottom pb-2">2. Método de Pago</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-12">
                                <label for="cc-name" class="form-label fw-semibold">Nombre en la tarjeta</label>
                                <input type="text" class="form-control" id="cc-name" required>
                                <small class="text-muted">Nombre completo como se muestra en la tarjeta</small>
                            </div>
                            <div class="col-md-6">
                                <label for="cc-number" class="form-label fw-semibold">Número de tarjeta</label>
                                <input type="text" class="form-control" id="cc-number" placeholder="ffff ffff ffff ffff" maxlength="16" required>
                            </div>
                            <div class="col-md-3">
                                <label for="cc-expiration" class="form-label fw-semibold">Expiración</label>
                                <input type="text" class="form-control" id="cc-expiration" placeholder="MM/AA" maxlength="5" required>
                            </div>
                            <div class="col-md-3">
                                <label for="cc-cvv" class="form-label fw-semibold">CVV</label>
                                <input type="text" class="form-control" id="cc-cvv" placeholder="000" maxlength="4" required>
                            </div>
                        </div>

                        <div id="checkout-alert-container"></div>

                        <button class="btn btn-checkout-submit w-100 py-3 fw-bold text-white mt-3" type="submit">
                            PAGAR AHORA
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/checkout.js"></script>
</body>

</html>
