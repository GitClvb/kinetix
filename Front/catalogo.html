<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinetixFit | Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/catalogo.css">
    <link rel="stylesheet" href="./css/reremodal.css">
</head>

<body>

    <div id="header-container"></div>

    <div id="cart-container"></div>

    <section class="hero-home">

        <div class="container text-center text-white">
            <h1 class="display-3 fw-bold italic">KinetixFit</h1>
            <p class="lead">Performance • Style • Discipline</p>
        </div>

    </section>

    <main class="container py-5">

        <div class="row">

            <div class="d-lg-none mb-3">

                <button class="btn btn-filtros-mobile w-100" type="button" data-bs-toggle="collapse"
                    data-bs-target="#panelFiltros">
                    <i class="bi bi-sliders"></i>
                    Filtros
                </button>

            </div>

            <aside class="col-lg-3 mb-4">
                <div class="collapse" id="panelFiltros">
                    <div class="filter-sidebar p-4">
                        <div class="mb-4">

                            <h6 class="fw-bold text-dark">
                                Género
                            </h6>

                            <div class="d-flex gap-2">

                                <button class="btn categoria-btn active-genero" data-genero="hombre">
                                    Hombre
                                </button>

                                <button class="btn categoria-btn" data-genero="mujer">
                                    Mujer
                                </button>

                            </div>

                        </div>

                        <div class="mb-4">

                            <h6 class="fw-bold text-dark">
                                Tallas
                            </h6>

                            <div class="sizes-filter">

                                <input id="talla-ch" class="filtro-talla" value="CH" type="checkbox">
                                <label for="talla-ch">
                                    CH
                                </label>

                                <input id="talla-m" class="filtro-talla" value="M" type="checkbox">
                                <label for="talla-m">
                                    M
                                </label>

                                <input id="talla-g" class="filtro-talla" value="G" type="checkbox">
                                <label for="talla-g">
                                    G
                                </label>

                            </div>

                        </div>

                    </div>
                </div>

            </aside>

            <section class="col-lg-9">

                <div class="categorias-wrapper">
                    <div class="d-flex gap-3 mb-4" id="contenedor-categorias">
                    </div>
                </div>

                <div class="catalogo-wrapper">

                    <div id="loader-catalogo" class="loader-catalogo d-none">

                        <div class="loader-spinner"></div>

                        <p>
                            Cargando colección...
                        </p>

                    </div>

                    <div class="row g-4" id="catalogo-grid"></div>

                </div>

            </section>

        </div>

    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/catalogo.js"></script>
    <script src="./js/cart.js"></script>
    <script src="./js/modal-fix.js"></script>

</body>

</html>
