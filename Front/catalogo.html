<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinetixFit | Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/catalogo.css">
    <link rel="stylesheet" href="./css/reremodal.css">
</head>

<body>

    <!-- HEADER -->
    <div id="header-container"></div>

    <!-- HERO -->
    <section class="hero-home">

        <div class="container text-center text-white">
            <h1 class="display-3 fw-bold italic">KinetixFit</h1>
            <p class="lead">Performance • Style • Discipline</p>
        </div>

    </section>

    <!-- CONTENIDO -->
    <main class="container py-5">

        <div class="row">

            <!-- SIDEBAR -->
            <aside class="col-lg-3 mb-4">

                <div class="filter-sidebar p-4">

                    <h4 class="fw-bold text-dark">
                        Filtros
                    </h4>

                    <!-- GENERO -->
                    <div class="mb-4">

                        <h6 class="fw-bold text-dark">
                            Género
                        </h6>

                        <div class="d-grid gap-2">

                            <button class="btn categoria-btn active-genero" data-genero="hombre">

                                Hombre

                            </button>

                            <button class="btn categoria-btn" data-genero="mujer">

                                Mujer

                            </button>

                        </div>

                    </div>

                    <!-- TALLAS -->
                    <div class="mb-4">

                        <h6 class="fw-bold text-dark">
                            Tallas
                        </h6>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox">
                            <label class="fw-bold text-dark">XS</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox">
                            <label class="fw-bold text-dark">S</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox">
                            <label class="fw-bold text-dark">M</label>
                        </div>

                    </div>

                </div>

            </aside>

            <!-- PRODUCTOS -->
            <section class="col-lg-9">

                <!-- CATEGORIAS -->
                <div class="d-flex gap-3 flex-wrap mb-4" id="contenedor-categorias">
                </div>
                
                <!-- GRID -->
                <div class="catalogo-wrapper">

                    <div id="loader-catalogo" class="loader-catalogo d-none">

                        <div class="loader-spinner"></div>

                        <p>
                            Cargando colección...
                        </p>

                    </div>

                    <div class="row g-4" id="catalogo-grid"></div>

                </div>

            </section>

        </div>

    </main>

    <!-- FOOTER -->
    <div id="footer-container"></div>

    <!-- JS -->
    <script src="./js/layout.js"></script>
    <script src="./js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/catalogo.js"></script>
    <script src="./js/modal-fix.js"></script>

</body>

</html>
