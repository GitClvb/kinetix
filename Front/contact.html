<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinetixFit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/post-no-bills-colombo" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
     <link rel="stylesheet" href="./css/reremodal.css">

</head>

<body>

    <div id="header-container"></div>
    <div id="cart-container"></div>

    <main>
        <section class="container py-5">

            <div class="row justify-content-center">
                <div class="col-lg-6">

                    <div class="card border-0 shadow-lg p-4">

                        <h3 class="text-center mb-4 text-orange fw-bold">
                            Estamos para ayudarte
                        </h3>

                        <form id="contactForm" action="https://formspree.io/f/xzdorpje" method="POST">

                            <input type="hidden" name="_subject" value="Nuevo mensaje desde KinetixFix">

                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre</label>
                                <input type="text" name="nombre" id="nombre" class="form-control">
                                <small class="text-danger" id="errorNombre"></small>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Correo electrónico</label>
                                <input type="email" name="email" id="correo" class="form-control">
                                <small class="text-danger" id="errorCorreo"></small>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Teléfono</label>
                                <input type="tel" name="telefono" id="telefono" class="form-control">
                                <small class="text-danger" id="errorTelefono"></small>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Mensaje</label>
                                <textarea name="message" id="mensaje" rows="4" class="form-control"></textarea>
                                <small class="text-danger" id="errorMensaje"></small>
                            </div>

                            <button id="btn-registro" class="btn text-white">
                                Enviar mensaje
                            </button>

                        </form>

                    </div>
                </div>
            </div>

        </section>

    </main>

<!-- FOOTER -->
    <div id="footer-container"></div>

    <!-- JS (ESTE ORDEN ES OBLIGATORIO) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/script.js"></script>
    <script src="./js/cart.js"></script>
    <script src="./js/modal-fix.js"></script>
</body>
</html>
