<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinetixFit | Producto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/producto.css">
    <link rel="stylesheet" href="./css/reremodal.css">
</head>

<body>

    <div id="header-container"></div>

    <div id="cart-container"></div>

    <main class="container py-5">

        <nav class="breadcrumb-custom mb-4">
            <a href="./catalogo.html" class="btn-regresar">
                <i class="bi bi-arrow-left"></i>
                Regresar
            </a>
        </nav>

        <div class="row g-5">

            <!-- GALERIA -->
            <div class="col-lg-6">

                <div class="producto-galeria">

                    <img id="imagen-principal" class="imagen-principal" alt="">

                </div>
            </div>

            <!-- INFO -->
            <div class="col-lg-6">

                <span class="producto-categoria" id="categoria-producto">

                </span>
                <h1 class="producto-titulo" id="nombre-producto">

                </h1>

                <div class="producto-precio" id="precio-producto">

                </div>

                <div class="mt-4">

                    <h6 class="section-title">
                        SELECCIONA TU TALLA
                    </h6>

                    <div class="sizes-container" id="contenedor-tallas">
                    </div>

                </div>

                <div class="mt-4">

                    <h6 class="section-title">
                        COLORES DISPONIBLES
                    </h6>

                    <div class="colors-container" id="contenedor-colores">
                    </div>

                </div>

                <div class="mt-4">

                    <h6 class="section-title">
                        CANTIDAD
                    </h6>

                    <div class="cantidad-container">

                        <button type="button" id="btn-restar-cantidad" class="cantidad-btn">
                            -
                        </button>

                        <input type="number" id="cantidad-producto" value="1" min="1" readonly>

                        <button type="button" id="btn-sumar-cantidad" class="cantidad-btn">
                            +
                        </button>

                    </div>

                </div>

                <button id="btn-add-cart" class="btn-add-cart mt-4 btn-agregar-carrito" data-producto-detalle="true">

                    <i class="bi bi-cart-plus"></i>
                    Añadir al carrito

                </button>

            </div>

        </div>
        <!-- DESCRIPCION -->

        <section class="descripcion-producto mt-5">

            <h4 class="mb-3">
                Descripción del producto
            </h4>

            <p id="descripcion-producto"></p>

        </section>

    </main>

    <div id="footer-container"></div>

     <!-- JS (ESTE ORDEN ES OBLIGATORIO) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/cart.js"></script>
    <script src="./js/carritoApi.js"></script>
     <script src="./js/producto.js"></script>
    <script src="./js/login.js"></script>
    <script src="./js/modal-fix.js"></script>
   

    <div class="toast-container position-fixed top-0 end-0 p-3">

        <div id="toastMensaje" class="toast toast-kinetix border-0" role="alert" data-bs-delay="2000">

            <div class="d-flex">

                <div class="toast-body" id="toastTexto">

                    Mensaje

                </div>

                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast">
                </button>

            </div>

        </div>

    </div>
</body>

</html>
