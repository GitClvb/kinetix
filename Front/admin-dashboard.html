<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinetixFit | Dashboard Administrativo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/post-no-bills-colombo" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/admin-dashboard.css">
</head>

<body>
    <!-- Barra superior -->
    <div class="barra text-center py-2">
    </div>

    <!-- Header Dashboard -->
    <header class="admin-dashboard-header bg-white shadow-sm">
        <div class="container">
            <div class="admin-dashboard-navbar">
                <div class="d-flex align-items-center gap-3">
                    <a href="#" class="navbar-brand m-0">
                        <img src="./img/logo-KIFI.png" alt="KinetixFit Logo" class="logo">
                    </a>
                </div>
                <a href="#" class="btn btn-registro-trigger" id="btnLogout">
                    <i class="bi bi-box-arrow-right me-1"></i>
                    Salir
                </a>
            </div>
        </div>
    </header>

    <main class="container py-4">

        <div class="page-header mb-4">
            <h1 class="page-title">
                Dashboard <span>Administrativo</span>
            </h1>

            <p class="page-subtitle">
                Resumen general de la tienda KinetixFit
            </p>
        </div>

        <!-- KPIS -->
        <div class="row g-4 mb-5">
            <div class="col-6 col-md-6 col-xl-3">
                <div class="dashboard-card">
                    <div class="card-icon">
                        <i class="bi bi-box-seam"></i>
                    </div>

                    <div>
                        <h3 id="totalProductos">0</h3>
                        <span>Productos</span>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-6 col-xl-3">
                <div class="dashboard-card">
                    <div class="card-icon">
                        <i class="bi bi-tags"></i>
                    </div>

                    <div>
                        <h3 id="totalCategorias">0</h3>
                        <span>Categorías</span>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-6 col-xl-3">
                <div class="dashboard-card">
                    <div class="card-icon">
                        <i class="bi bi-cart-check"></i>
                    </div>

                    <div>
                        <h3 id="pedidosHoy">0</h3>
                        <span>Pedidos Hoy</span>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-6 col-xl-3">
                <div class="dashboard-card">
                    <div class="card-icon">
                        <i class="bi bi-currency-dollar"></i>
                    </div>

                    <div>
                        <h3 id="ventasMes">$0</h3>
                        <span>Ventas del Mes</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Acciones rápidas -->
        <div class="card card-dashboard mb-4">

            <div class="card-header">
                Acciones Rápidas
            </div>

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-4 col-md-4">
                        <a href="admin-producto.html" class="quick-action">
                            <i class="bi bi-plus-circle"></i>
                            <span>Productos</span>
                        </a>
                    </div>

                    <div class="col-4 col-md-4">
                        <a href="admin-pedidos.html" class="quick-action">
                            <i class="bi bi-bag-check"></i>
                            <span>Pedidos</span>
                        </a>
                    </div>

                    <div class="col-4 col-md-4">
                        <a href="admin-clientes.html" class="quick-action">
                            <i class="bi bi-people"></i>
                            <span>Clientes</span>
                        </a>
                    </div>

                </div>

            </div>

        </div>

        <!-- Últimos pedidos -->
        <div class="card card-dashboard">

            <div class="card-header"> Últimos Pedidos </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Pedido</th>
                                <th>Cliente</th>
                                <th>Total</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyUltimosPedidos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/admin-dashboard.js"></script>
</body>

</html>
