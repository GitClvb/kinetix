<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetix | Login</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Base -->
    <link rel="stylesheet" href="css/base.css">
    <!-- Login -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">
        
         <!-- Lado izquierdo -->
        <section class="login-visual">
            <a href="index.html" class="brand">KINETIX</a>
            <div class="visual-content">
                <h1>Llegó el momento<br>de superarte</h1>
                <p> Accede a tu perfil KINETIX FIT</p>
                <div class="visual-line"></div>
            </div>
        </section>

        <!-- Lado derecho -->
        <section class="login-form-section">
            <a href="index.html" class="close-login">Página principal -></a>

            <div class="login-header">
                <h2>Bienvenido</h2>
                <p>Inicia sesión para continuar</p>
            </div>

            <!-- ALERTAS -->
            <div id="alertContainer"></div>

            <!-- FORMULAROI -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario o Correo</label>
                    <input type="text" id="username" placeholder="Ingresa tu usuario">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>

                <button type="submit" class="btn-ini">Iniciar Sesión</button>
            </form>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/carritoApi.js"></script>
    <script src="./js/login.js"></script>

</body>

</html>
