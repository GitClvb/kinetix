<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinetixFit | Administración de Clientes</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link href="https://fonts.cdnfonts.com/css/post-no-bills-colombo"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/admin-clientes.css">
</head>

<body>

    <div id="header-container-admin"></div>

    <main class="container py-5">

        <div class="page-header mb-4">
            <h1 class="page-title">
                Administración de <span>Clientes</span>
            </h1>
        </div>

        <!-- Estadísticas -->
        <div class="row g-4 mb-4">

            <div class="col-md-4">
                <div class="card-dashboard">
                    <i class="bi bi-people icon"></i>
                    <div class="value" id="totalUsuarios">0</div>
                    <div class="label">Usuarios Totales</div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-dashboard">
                    <i class="bi bi-person-fill icon"></i>
                    <div class="value" id="totalClientes">0</div>
                    <div class="label">Clientes</div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-dashboard">
                    <i class="bi bi-shield-lock-fill icon"></i>
                    <div class="value" id="totalAdmins">0</div>
                    <div class="label">Administradores</div>
                </div>
            </div>

        </div>

        <!-- Tabla -->
        <div class="table-container">

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Registro</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tbodyClientes">
                    </tbody>

                </table>

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/admin-clientes.js"></script>

</body>

</html>
