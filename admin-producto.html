<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinetixFit | Crear Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
    <style>
        .form-container { max-width: 700px; margin: 50px auto; }
        .text-orange { color: #ff6633; }
        .btn-kinetix { background-color: #ff6633; color: white; border: none; }
        .btn-kinetix:hover { background-color: #e55a2d; color: white; }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <main class="container py-5">
        <div class="form-container card shadow-lg p-4 border-0">
            <h2 class="text-center fw-bold mb-4 text-orange">NUEVO PRODUCTO</h2>
            
            <div id="alert-container"></div>

            <form id="productForm" novalidate>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="nombreProducto" placeholder="Nombre" required>
                    <label for="nombreProducto">Nombre del Producto</label>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Categoría</label>
                        <select class="form-select" id="categoriaProducto" required>
                            <option value="">Selecciona una opción...</option>
                            <option value="Playeras">Playeras</option>
                            <option value="Shorts">Shorts</option>
                            <option value="Sudaderas">Sudaderas</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Precio (MXN)</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" id="precioProducto" step="0.01" required>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Descripción</label>
                    <textarea class="form-control" id="descripcionProducto" rows="3" required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">URL de la Imagen</label>
                    <input type="url" class="form-control" id="urlImagen" placeholder="https://ejemplo.com/imagen.png" required>
                </div>

                <button type="submit" class="btn btn-kinetix w-100 py-2 fw-bold">CREAR PUBLICACIÓN</button>
            </form>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/admin-producto.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
