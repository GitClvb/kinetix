<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinetixFit | Crear Producto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/admin-producto.css">
    <style>

    </style>
</head>

<body>
    <div id="header-container"></div>

    <main class="container py-5">
        <div class="form-container card shadow-lg p-4 border-0">
            <h2 class="text-center fw-bold mb-4 text-orange">NUEVO PRODUCTO</h2>

            <form id="productForm" novalidate>
                <div class="mb-3">
                    <label class="form-label fw-bold d-block">Género</label>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="generoProducto" id="generoHombre"
                            value="Hombre" required>

                        <label class="form-check-label" for="generoHombre">
                            Hombre
                        </label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="generoProducto" id="generoMujer"
                            value="Mujer">

                        <label class="form-check-label" for="generoMujer">
                            Mujer
                        </label>
                    </div>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="nombreProducto" placeholder="Nombre" required>
                    <label for="nombreProducto">Nombre del Producto</label>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Categoría</label>
                        <select class="form-select" id="categoriaProducto" required>
                            <option value="">Selecciona una opción...</option>
                            <option value="Playeras">Playeras</option>
                            <option value="Shorts">Shorts</option>
                            <option value="Sudaderas">Sudaderas</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Precio (MXN)</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="text" class="form-control" id="precioProducto" placeholder="0.00" required>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Descripción</label>
                    <textarea class="form-control" id="descripcionProducto" rows="3" required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">URL de la Imagen</label>
                    <input type="url" class="form-control" id="urlImagen" placeholder="https://ejemplo.com/imagen.png"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Cargar imagen</label>
                    <input type="file" class="form-control" id="imagenArchivo" accept="image/*">
                </div>

                <div class="text-center mb-3">
                    <img id="previewImagen" src="" alt="Vista previa" class="img-fluid rounded shadow d-none"
                        style="max-height: 200px;">
                </div>

                <div class="text-center mb-4">
                    <button type="button" id="btnEliminarImagen" class="btn btn-secondary btn-borrar w-40 py-2 fw-bold d-none">
                        ELIMINAR IMAGEN
                    </button>
                </div>
                <br><br>

                <button type="submit" class="btn btn-kinetix-crear w-100 py-2 fw-bold">CREAR PUBLICACIÓN</button>

                <br><br>
                <div id="alert-container"></div>

            </form>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/admin-producto.js"></script>
    <script src="./js/modal-fix.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
