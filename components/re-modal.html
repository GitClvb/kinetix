<div class="modal fade" id="registroModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <!-- bg-dark y border-0 para quitar el borde feo por defecto -->
        <div class="modal-content bg-dark text-white border-0 shadow-lg">
            
            <div class="modal-header border-bottom border-secondary">
                <h5 class="modal-title fw-bold text-uppercase" style="letter-spacing: 1px;">
                    <span class="text-orange">Únete</span> al Team
                </h5>
                <!-- btn-close-white invierte el color de la X -->
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4">
                <!-- Aquí aparecerá la notificación de éxito -->
                <div id="alertContainer"></div>

                <form id="registerForm">
                    <div class="mb-3">
                        <input type="text" id="nombre" class="form-control input-kinetix" placeholder="Nombre completo">
                    </div>
                    
                    <div class="mb-3">
                        <input type="tel" id="telefono" class="form-control input-kinetix" placeholder="Teléfono">
                    </div>
                    
                    <div class="mb-3">
                        <input type="email" id="correo" class="form-control input-kinetix" placeholder="Correo electrónico">
                    </div>
                    
                    <div class="mb-3">
                        <input type="password" id="password" class="form-control input-kinetix" placeholder="Contraseña">
                    </div>

                    <div class="mb-4">
                        <input type="password" id="confirmPassword" class="form-control input-kinetix" placeholder="Confirmar contraseña">
                    </div>

                    <button type="button" id="btnCrearCuenta" class="btn btn-kinetix w-100 py-2 fw-bold text-uppercase">
                        Crear cuenta
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
