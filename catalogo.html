<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinetixFit | Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/kinetix-main/css/base.css">
    <link rel="stylesheet" href="/kinetix-main/css/catalogo.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="container py-5">
        <div class="row">
            <aside class="col-lg-3 mb-4">
                <div class="filter-sidebar p-3 shadow-sm bg-white rounded">
                    <h4 class="fw-bold mb-3">Filtrar por</h4>
                    <hr>
                    <div class="filter-group mb-4">
                        <h6>Talla</h6>
                        <div class="form-check"><input class="form-check-input" type="checkbox"> <label>Extra chica (XS)</label></div>
                        <div class="form-check"><input class="form-check-input" type="checkbox" checked> <label>Chica (S)</label></div>
                        <div class="form-check"><input class="form-check-input" type="checkbox"> <label>Mediana (M)</label></div>
                    </div>
                    <div class="filter-group mb-4">
                        <h6>Color</h6>
                        <div class="form-check"><input class="form-check-input" type="checkbox"> <label>Negro</label></div>
                        <div class="form-check"><input class="form-check-input" type="checkbox"> <label>Rojo</label></div>
                    </div>
                    <div class="filter-group">
                        <h6>Precio</h6>
                        <div class="form-check"><input class="form-check-input" type="checkbox"> <label>$100 - $500</label></div>
                    </div>
                </div>
            </aside>

            <section class="col-lg-9">
                <div class="d-flex gap-2 mb-4 overflow-auto pb-2">
                    <button class="btn btn-dark rounded-0 px-4">PLAYERAS</button>
                    <button class="btn btn-light rounded-0 px-4 border">SHORTS</button>
                    <button class="btn btn-light rounded-0 px-4 border">SUDADERAS</button>
                </div>

                <div class="row g-4" id="catalogo-grid">
                    </div>
            </section>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="./js/layout.js"></script>
    <script src="./js/script.js"></script>
    <script src="/kinetix-main/js/catalogo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
