<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBM Sports - Finalizar Compra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4 shadow">
  <a href="index.html" class="btn btn-outline-warning">← Volver a la Tienda</a>
  <span class="navbar-brand mx-auto text-warning fw-bold">Checkout MBM</span>
</nav>

<div class="container py-5">
  <div class="row g-5">
    
    <div class="col-md-5 col-lg-4 order-md-last">
      <h4 class="d-flex justify-content-between align-items-center mb-3">
        <span class="text-dark">Tu carrito</span>
        <span class="badge bg-warning text-dark rounded-pill" id="contador-productos">0</span>
      </h4>
      
      <ul id="lista" class="list-group mb-3 shadow-sm">
        </ul>

      <div class="list-group-item d-flex justify-content-between bg-white p-3 border rounded">
        <span>Total (MXN)</span>
        <strong id="total" class="text-success fs-5">$0.00</strong>
      </div>

      <hr>
      <button class="btn btn-outline-danger btn-sm w-100" onclick="vaciarCarrito()">
        Vaciar todo el carrito
      </button>
    </div>

    <div class="col-md-7 col-lg-8">
      <div class="card p-4 shadow-sm border-0">
        <h4 class="mb-4">Información de Pago</h4>
        <form id="paymentForm">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Nombre completo en la tarjeta</label>
              <input type="text" class="form-control" id="cardName" placeholder="Juan Israel Pérez" required>
            </div>

            <div class="col-12">
              <label class="form-label">Número de tarjeta</label>
              <input type="text" class="form-control" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="16" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Expiración (MM/AA)</label>
              <input type="text" class="form-control" placeholder="12/26" maxlength="5" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">CVV</label>
              <input type="password" class="form-control" placeholder="123" maxlength="3" required>
            </div>
          </div>

          <hr class="my-4">

          <button class="w-100 btn btn-warning btn-lg fw-bold" type="submit">
            Confirmar Pago
          </button>
        </form>
      </div>
    </div>

  </div>
</div>

<footer class="text-center py-4 text-muted">
  <small>© 2026 MBM Sports - Pago Seguro SSL</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script>
  // Ejecutar al cargar para mostrar lo que hay en localStorage
  document.addEventListener('DOMContentLoaded', mostrarCarrito);
</script>

</body>
</html>
