<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBM - Tienda deportiva</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
  <a class="navbar-brand text-warning fw-bold" href="#">MBM Sports</a>

  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse justify-content-end" id="menu">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link btn btn-warning text-dark px-3" href="#">Carrito 🛒</a>
      </li>
    </ul>
  </div>
</nav>

<section class="hero d-flex align-items-center text-center text-white">
  <div class="container">
    <h1 class="display-4 fw-bold">Entrena y esfuérzate</h1>
    <p class="lead">Los mejores productos para deportes</p>
  </div>
</section>

<section class="container py-5 text-center">
  <h2 class="mb-4">Productos Destacados</h2>

  <div class="row g-4">

    <div class="col-md-4">
      <div class="card shadow h-100">
        <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab" class="card-img-top" alt="">
        <div class="card-body">
          <h5 class="card-title">Playera DryFit</h5>
          <p class="card-text">$399 MXN</p>
          <button class="btn btn-success">Agregar al carrito</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow h-100">
        <img src="https://images.unsplash.com/photo-1593032465171-8f9f1b7d6c2d" class="card-img-top" alt="">
        <div class="card-body">
          <h5 class="card-title">Short Deportivo</h5>
          <p class="card-text">$299 MXN</p>
          <button class="btn btn-success">Agregar al carrito</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow h-100">
        <img src="https://images.unsplash.com/photo-1600180758890-6b94519a8ba6" class="card-img-top" alt="">
        <div class="card-body">
          <h5 class="card-title">Sudadera</h5>
          <p class="card-text">$699 MXN</p>
          <button class="btn btn-success">Agregar al carrito</button>
        </div>
      </div>
    </div>

  </div>
</section>

<footer class="bg-dark text-white text-center py-3">
  <p class="mb-0">© 2026 MBM - Todos los derechos reservados</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
